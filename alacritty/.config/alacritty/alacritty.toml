[general]
import = []

[window]
decorations = "None"
padding = { x = 12, y = 12 }
opacity = 0.95

[font]
size = 18
normal = { family = "JetBrains Mono", style = "Bold" }

[scrolling]
history = 3023

[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 500
unfocused_hollow = true

[mouse]
hide_when_typing = true

[selection]
save_to_clipboard = false

[bell]
duration = 0

[colors.primary]
background = "#171817"
foreground = "#e2dfd2"
bright_foreground = "#fff9e8"

[colors.cursor]
text = "#171817"
cursor = "#f3e8bd"

[colors.selection]
text = "#e2dfd2"
background = "#454344"

[colors.normal]
black   = "#292928"
red     = "#b07f7b"
green   = "#a7a58a"
yellow  = "#d6c99e"
blue    = "#8c9a9e"
magenta = "#a58c91"
cyan    = "#9ba9a5"
white   = "#c9c7bb"

[colors.bright]
black   = "#5b5954"
red     = "#d19a91"
green   = "#c2c0a0"
yellow  = "#f0dfb0"
blue    = "#b1c2c5"
magenta = "#c4a5aa"
cyan    = "#bdcbc4"
white   = "#fff9e8"

[keyboard]
bindings = [
  { key = "C",       mods = "Control|Shift", action = "Copy"  },
  { key = "V",       mods = "Control|Shift", action = "Paste" },
  { key = "N",       mods = "Control|Shift", action = "SpawnNewInstance" },
  { key = "Equals",  mods = "Control|Shift", action = "IncreaseFontSize" },
  { key = "Minus",   mods = "Control",       action = "DecreaseFontSize" },
  { key = "Key0",    mods = "Control",       action = "ResetFontSize"    },
  { key = "Enter",   mods = "Shift",         chars = "\n" },
]
