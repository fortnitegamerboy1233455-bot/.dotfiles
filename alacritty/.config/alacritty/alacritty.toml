[general]
import = []

[window]
decorations = "None"
padding = { x = 12, y = 12 }
opacity = 0.95

[font]
size = 18
normal = { family = "JetBrains Mono", style = "Bold" }

[scrolling]
history = 3023

[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 500
unfocused_hollow = true

[mouse]
hide_when_typing = true

[selection]
save_to_clipboard = false

[bell]
duration = 0

[colors.primary]
foreground = "#2A173B"
background = "#0D060F"

[colors.cursor]
cursor = "#A77188"
text = "#EFB3AF"

[colors.selection]
background = "#A77188"
text = "CellForeground"

[colors.normal]
magenta = "#2A173B"
blue = "#4A294D"
yellow = "#704C68"
red = "#EFB3AF"
cyan = "#A77188"
black = "#1E0A20"

[colors.bright]
magenta = "#2A173B"
blue = "#4A294D"
yellow = "#704C68"
red = "#EFB3AF"
cyan = "#A77188"
black = "#220C24"

[keyboard]
bindings = [
  { key = "C",       mods = "Control|Shift", action = "Copy"  },
  { key = "V",       mods = "Control|Shift", action = "Paste" },
  { key = "N",       mods = "Control|Shift", action = "SpawnNewInstance" },
  { key = "Equals",  mods = "Control|Shift", action = "IncreaseFontSize" },
  { key = "Minus",   mods = "Control",       action = "DecreaseFontSize" },
  { key = "Key0",    mods = "Control",       action = "ResetFontSize"    },
  { key = "Enter",   mods = "Shift",         chars = "\n" },
]
